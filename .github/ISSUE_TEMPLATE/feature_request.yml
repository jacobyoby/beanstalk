name: Feature Request
description: Suggest a new feature for Ponder
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user problem does this solve?
      placeholder: As a user tracking recalls I want...
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: Describe UX, API, openFDA fields, etc.
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [search, filters, recall-card, recall-detail, api/mockData, infra/ci, docs, other]
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked existing issues/discussions
          required: true
