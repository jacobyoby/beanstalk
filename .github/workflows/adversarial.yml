name: Adversarial Verify
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [labeled]
concurrency:
  group: adversarial-${{ github.event.pull_request.number }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  skeptic-claims:
    name: "Skeptic: Claim Refuter"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || contains(github.event.label.name, 'retry-adversarial')
    steps:
      - uses: actions/checkout@v7
        with: { ref: "refs/pull/${{ github.event.pull_request.number }}/merge", fetch-depth: 0 }
      - name: Extract PR claims
        run: |
          gh pr view ${{ github.event.pull_request.number }} --json title,body,commits --jq '{title, body}' > claims.json
          cat claims.json
          if ! grep -q "Closes" claims.json; then
            echo "::error::PR body missing Closes reference"
            exit 1
          fi
          if [ -z "$(git diff --name-only origin/${{ github.base_ref }}...HEAD)" ]; then
            echo "::error::No diff found for claims verification"
            exit 1
          fi
          echo "Claims reference present and diff non-empty — manual review required for full substantiation"
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  skeptic-tests:
    name: "Skeptic: Test Adversary"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { ref: "refs/pull/${{ github.event.pull_request.number }}/merge", fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: food-recall-app/package-lock.json }
      - run: npm ci
        working-directory: food-recall-app
      - name: Adversarial test run
        working-directory: food-recall-app
        run: npm run test:coverage
  skeptic-security:
    name: "Skeptic: Security"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { ref: "refs/pull/${{ github.event.pull_request.number }}/merge", fetch-depth: 0 }
      - name: Secret scan
        run: |
          echo "Scanning diff for real secrets (excluding GITHUB_TOKEN/GH_TOKEN workflow refs)..."
          if git diff origin/${{ github.base_ref }}...HEAD | grep -v "GITHUB_TOKEN" | grep -v "GH_TOKEN" | grep -ivE "(secrets\.GITHUB_TOKEN|github\.token)" | grep -iE "(api_key|secret|password).*[=:][[:space:]]*[\"'][^\"']{8,}" ; then
            echo "::error::Potential hardcoded secret in diff"
            exit 1
          fi
          echo "No hardcoded secrets detected"
          grep -r "openFDA" food-recall-app/src --include="*.ts" --include="*.tsx" | head || true
  skeptic-data:
    name: "Skeptic: Data Integrity"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { ref: "refs/pull/${{ github.event.pull_request.number }}/merge", fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: food-recall-app/package-lock.json }
      - run: npm ci
        working-directory: food-recall-app
      - name: Validate recall types
        working-directory: food-recall-app
        run: |
          npx tsc --noEmit --project tsconfig.json
          grep -r "RecallClassification" src || { echo "::error::Missing RecallClassification check"; exit 1; }
  skeptic-ux:
    name: "Skeptic: UX Consistency"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { ref: "refs/pull/${{ github.event.pull_request.number }}/merge", fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: food-recall-app/package-lock.json }
      - name: Build check
        working-directory: food-recall-app
        run: |
          set -o pipefail
          npm ci
          npm run build
  adversarial-verdict:
    name: adversarial-verdict
    runs-on: ubuntu-latest
    needs: [skeptic-claims, skeptic-tests, skeptic-security, skeptic-data, skeptic-ux]
    if: always()
    steps:
      - name: Aggregate verdict
        run: |
          echo "Skeptic results: claims=${{ needs.skeptic-claims.result }} tests=${{ needs.skeptic-tests.result }} security=${{ needs.skeptic-security.result }} data=${{ needs.skeptic-data.result }} ux=${{ needs.skeptic-ux.result }}"
          if [ "${{ needs.skeptic-claims.result }}" != "success" ] && [ "${{ needs.skeptic-claims.result }}" != "skipped" ] || [ "${{ needs.skeptic-tests.result }}" != "success" ] || [ "${{ needs.skeptic-security.result }}" != "success" ] || [ "${{ needs.skeptic-data.result }}" != "success" ] || [ "${{ needs.skeptic-ux.result }}" != "success" ]; then
            echo "::error::Adversarial verification failed"
            exit 1
          fi
          echo "All skeptics failed to refute — PR passes adversarial verification."