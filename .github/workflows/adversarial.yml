name: Adversarial Verify

# Two checks that ci.yml does not run: the PR body must reference an issue
# (`Closes #N`), and the diff must not introduce a hardcoded secret.
#
# This file used to also run the build, `tsc --noEmit` and the test suite under
# the names "UX Consistency", "Data Integrity" and "Test Adversary". Those were
# byte-for-byte the same commands ci.yml runs on the same push — three extra
# runners and three extra `npm ci` per push for no additional coverage. ci.yml
# is the build, typecheck and test adversary; see #124 for the measurements.
#
# Re-run on demand by adding the `retry-adversarial` label. Every job is gated
# on that label so that other labels — including the ones pr-review.yml adds
# automatically — do not re-run the suite.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [labeled]

concurrency:
  group: adversarial-${{ github.event.pull_request.number }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  skeptic-claims:
    name: "Skeptic: Claim Refuter"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' || github.event.label.name == 'retry-adversarial'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "refs/pull/${{ github.event.pull_request.number }}/merge", fetch-depth: 0 }
      - name: Extract PR claims
        run: |
          gh pr view ${{ github.event.pull_request.number }} --json title,body --jq '{title, body}' > claims.json
          cat claims.json
          if ! grep -q "Closes" claims.json; then
            echo "::error::PR body missing Closes reference"
            exit 1
          fi
          if [ -z "$(git diff --name-only origin/${{ github.base_ref }}...HEAD)" ]; then
            echo "::error::No diff found for claims verification"
            exit 1
          fi
          echo "Claims reference present and diff non-empty — manual review required for full substantiation"
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  skeptic-security:
    name: "Skeptic: Security"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' || github.event.label.name == 'retry-adversarial'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "refs/pull/${{ github.event.pull_request.number }}/merge", fetch-depth: 0 }
      - name: Secret scan
        run: |
          echo "Scanning diff for real secrets (excluding GITHUB_TOKEN/GH_TOKEN workflow refs)..."
          if git diff origin/${{ github.base_ref }}...HEAD | grep -v "GITHUB_TOKEN" | grep -v "GH_TOKEN" | grep -ivE "(secrets\.GITHUB_TOKEN|github\.token)" | grep -iE "(api_key|secret|password).*[=:][[:space:]]*[\"'][^\"']{8,}" ; then
            echo "::error::Potential hardcoded secret in diff"
            exit 1
          fi
          echo "No hardcoded secrets detected"

  adversarial-verdict:
    name: adversarial-verdict
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [skeptic-claims, skeptic-security]
    if: always() && (github.event_name == 'pull_request' || github.event.label.name == 'retry-adversarial')
    steps:
      - name: Aggregate verdict
        run: |
          echo "Skeptic results: claims=${{ needs.skeptic-claims.result }} security=${{ needs.skeptic-security.result }}"
          if [ "${{ needs.skeptic-claims.result }}" != "success" ] || [ "${{ needs.skeptic-security.result }}" != "success" ]; then
            echo "::error::Adversarial verification failed"
            exit 1
          fi
          echo "All skeptics failed to refute — PR passes adversarial verification."
