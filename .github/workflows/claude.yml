name: Claude

# On-demand Claude, not on every push: this runs only when someone with write
# access to the repository writes `@claude` in an issue, a pull request comment,
# or a review. Mention it with a question or an instruction and it answers in
# the thread, or pushes a branch when asked to make a change. The action refuses
# triggers from users without write access by default; do not set
# `allowed_non_write_users` on a public repository.
#
# The job itself is gated on the comment containing `@claude`, so ordinary
# comments do not spin up a runner. With no `prompt` input the action is in tag
# mode; giving it a `prompt` would turn it into an every-event automation.
#
# Requires an `ANTHROPIC_API_KEY` secret visible to this repository. Until it
# is, the step is skipped and the job stays green rather than failing.
#
# `id-token: write` is required: the action exchanges the workflow's OIDC token
# to post as the Claude GitHub App rather than as github-actions[bot].

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Respond to @claude
        if: env.ANTHROPIC_API_KEY != ''
        uses: anthropics/claude-code-action@0a8d3c9443bbff909ab973b6a17a340b913f229f # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-opus-5
