name: Demo artifact
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: food-recall-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: food-recall-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:demo
        env:
          VITE_OPENFDA_KEY: BEANSTALK_BUILD_SECRET_SENTINEL
