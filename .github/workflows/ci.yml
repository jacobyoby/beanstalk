name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: food-recall-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: food-recall-app/package-lock.json }
      - run: npm ci
      - run: npm run build
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: food-recall-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: food-recall-app/package-lock.json }
      - run: npm ci
      - run: npm run lint
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: food-recall-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: food-recall-app/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: food-recall-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: food-recall-app/package-lock.json }
      - run: npm ci
      - run: npm run test
