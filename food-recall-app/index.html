<head>

  <meta name="description" content="Track FDA food recalls and allergen alerts for your dietary needs">

  <meta name="theme-color" content="#f8f6ee" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111e17" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg">
  <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png">
  <script>
    // Apply the stored or system theme before first paint to avoid a light flash.
    try {
      const stored = localStorage.getItem("ponder_dark_mode");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (stored === "true" || (stored === null && prefersDark)) document.documentElement.classList.add("dark");
    } catch {
      /* storage unavailable */
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>
    <h1>Beanstalk — Food Recall Tracker</h1>
  </noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
