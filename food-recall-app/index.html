<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f6ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111e17" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Explore FDA food recall records by product, distribution state, and dietary concern." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>beanstalk</title>
    <script>
      // Apply the stored or system theme before first paint to avoid a light flash.
      try {
        var stored = localStorage.getItem('ponder_dark_mode')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (stored === 'true' || (stored === null && prefersDark)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
